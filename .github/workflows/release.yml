name: LABOSURF PRO Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: engines/udp/go.sum

      - name: Tests
        run: |
          go test ./internal/...
          go build ./...
          (cd engines/udp && go test ./...)

      - name: Read public verification key
        id: key
        run: |
          KEY_FILE="release/license_pub.key"
          if [[ ! -f "$KEY_FILE" ]]; then
            # Fallback: copier depuis engines/udp/ si release/ pas encore à jour
            KEY_FILE="engines/udp/labosurf_pub.key"
          fi
          test -f "$KEY_FILE" || { echo "Fichier clé publique introuvable (release/license_pub.key ou engines/udp/labosurf_pub.key)."; exit 1; }
          PUBKEY="$(tr -d '[:space:]' < "$KEY_FILE")"
          test "${#PUBKEY}" -eq 64 || { echo "Clé publique invalide (${#PUBKEY} caractères, 64 attendus)."; exit 1; }
          echo "$PUBKEY" > license_pub.key
          echo "PUBKEY=${PUBKEY}" >> "$GITHUB_OUTPUT"

      - name: Build Linux binaries
        env:
          PUBKEY: ${{ steps.key.outputs.PUBKEY }}
        run: |
          mkdir -p dist
          cd engines/udp

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -trimpath             -ldflags "-X main.embeddedVerifyKeyHex=${PUBKEY}"             -o ../../dist/labosurf-linux-amd64 .

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64             go build -trimpath             -ldflags "-X main.embeddedVerifyKeyHex=${PUBKEY}"             -o ../../dist/labosurf-linux-arm64 .

          # Binaire Android/ARM64 pour une utilisation en local sous Termux
          # (menu admin, gestion des comptes, licences directement sur le
          # téléphone). CGO désactivé : pas besoin du NDK Android.
          CGO_ENABLED=0 GOOS=android GOARCH=arm64             go build -trimpath             -ldflags "-X main.embeddedVerifyKeyHex=${PUBKEY}"             -o ../../dist/labosurf-android-arm64 .

          cp ../../license_pub.key ../../dist/license_pub.key

          cd ../../dist
          sha256sum labosurf-linux-* labosurf-android-* license_pub.key > SHA256SUMS

      - name: Build engine binaries
        run: |
          cd "${{ github.workspace }}"
          mkdir -p dist
          ENGINES="xray slowdns dnstt hysteria udp ssh"
          for name in $ENGINES; do
            for goos_arch in linux/amd64 linux/arm64 android/arm64; do
              GOOS="${goos_arch%/*}"; GOARCH="${goos_arch#*/}"
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath \
                -o "dist/labosurf-${name}-${GOOS}-${GOARCH}" \
                "./cmd/labosurf-${name}"
            done
          done
          cd dist
          sha256sum labosurf-*-linux-* labosurf-*-android-* > SHA256SUMS.engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "LABOSURF PRO ${GITHUB_REF_NAME}"
